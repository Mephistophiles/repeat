name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... -count=1 -race

      - name: Integration tests
        run: go test -tags=integration ./test/integration/ -v -count=1 -timeout 120s

      - name: Build
        run: go build ./cmd/repeat/
